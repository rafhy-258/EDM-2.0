name: backend-ci

on:
  push:
    branches: ['**']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Restore, build, test (unit, architecture, integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # Integration tests start a PostgreSQL container with Testcontainers (Docker is preinstalled on ubuntu-latest).
      # EDM_TEST_POSTGRES is deliberately not set here, so CI always uses a fresh container.
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK (version pinned by backend/global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show SDK
        run: dotnet --version

      - name: Restore (locked to central package versions)
        run: |
          set -o pipefail
          dotnet restore EDM.sln 2>&1 | tee ci-restore.log

      - name: Build (warnings are errors)
        run: |
          set -o pipefail
          dotnet build EDM.sln --no-restore -c Release 2>&1 | tee ci-build.log

      - name: Test
        run: |
          set -o pipefail
          dotnet test EDM.sln --no-build -c Release \
            --logger "trx;LogFileName=results.trx" \
            --results-directory TestResults \
            --collect:"XPlat Code Coverage" 2>&1 | tee ci-test.log

      - name: Summarise failures as annotations
        if: failure()
        run: python3 ../.github/scripts/summarise-ci-failures.py

      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-output
          path: |
            backend/ci-*.log
            backend/TestResults
          if-no-files-found: ignore
          retention-days: 14
